name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant. main is exempt: those
# runs are the record of what was merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Named plainly because the ruleset on main requires this check by name, and
  # a rename here silently stops that requirement matching anything.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Replays Turbo's cache so unchanged packages aren't rebuilt. The key
      # carries the SHA so every run writes a fresh entry; restore-keys fall
      # back to the newest prior one, which is what actually gets reused.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm lint
      # Depends on ^build, so this compiles the workspace packages on the way.
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

  # Image builds are slow and the packaging rarely changes, so they run only
  # when something they depend on moves. This is a separate job rather than a
  # workflow-level paths filter: a filtered-out workflow never reports a status
  # at all, which leaves a required check pending forever.
  changes:
    name: detect packaging changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push to a branch reports an all-zero base SHA, and there is
          # nothing to diff against — build in that case rather than skip.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE \
            '^(apps/[^/]+/Dockerfile|\.dockerignore|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|docker-compose\.prod\.yml)$'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: docker image (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, auth-web]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Build only. There is no registry to push to — what this catches is the
      # packaging itself: turbo prune dropping a workspace, or the --prod
      # install leaving the image without something it needs at runtime.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
