# Production stack. Standalone, not an override of docker-compose.yml — that one
# publishes 5432 for local dev, which must not carry into production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only caddy publishes ports. auth-web and postgres are reachable exclusively
# on the compose network, and the API not even that — it listens on a unix
# socket in a volume shared with auth-web, so it has no network presence at all.

name: personal-ops

# The api image is used by two services — the server and the one-shot migration
# that runs ahead of it. Sharing the build here names the image once, so the
# second service is a cache hit rather than a second build.
x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: personal-ops-api

x-database-url: &database-url
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/personal_ops

# Every public host is a subdomain of one registrable parent. Only the auth
# host exists today, but the session cookie is scoped to the parent so that a
# sign-in here is visible to any tool added later on a sibling subdomain —
# which only holds while all of them sit under the one parent, so they are
# derived from it rather than set by hand.
x-hosts: &hosts
  ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN in .env}
  AUTH_DOMAIN: auth.${ROOT_DOMAIN}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      <<: *hosts
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the issued certificates. Losing this volume means re-issuing and
      # burning Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - auth-web

  # The sign-in and sign-up screens. Reaches the API over the same socket as
  # every other frontend — it holds no credentials of its own and talks to
  # Better Auth through the identical /api/auth proxy.
  auth-web:
    build:
      context: .
      dockerfile: apps/auth-web/Dockerfile
    restart: unless-stopped
    environment:
      API_SOCKET_PATH: /run/api/api.sock
      # No tool to hand off to yet, so sign-in lands back on the auth app's
      # own page. Point this at the first tool that gets built.
      DEFAULT_REDIRECT_URL: https://auth.${ROOT_DOMAIN}
      # A ?redirect_to= naming anything else is discarded rather than followed.
      ALLOWED_REDIRECT_ORIGINS: https://auth.${ROOT_DOMAIN}
    volumes:
      - api-socket:/run/api
    depends_on:
      - api

  # Applies pending migrations, then exits. Runs as its own service rather than
  # from the API's entrypoint so that the schema is never touched by more than
  # one process, however many API containers there turn out to be.
  migrate:
    <<: *api-image
    restart: "no"
    command: node packages/db/dist/migrate.js
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *database-url
      API_SOCKET_PATH: /run/api/api.sock
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # The public origin, path-free — a path here stops Better Auth matching
      # any route. Cookie attributes and OAuth callbacks are built from this,
      # never from the socket address the API answers on. The auth host, since
      # that is where sign-in actually happens.
      BETTER_AUTH_URL: https://auth.${ROOT_DOMAIN}
      # Scopes the session cookie to the parent domain so that a sign-in on the
      # auth host is a sign-in everywhere. Host-only, the default, would leave
      # every app but this one seeing a logged-out visitor.
      AUTH_COOKIE_DOMAIN: .${ROOT_DOMAIN}
      # The apps still proxy /api/auth on their own origins to read sessions
      # and sign out, so requests arrive under more than one Origin and Better
      # Auth turns away any it was not told to expect.
      BETTER_AUTH_TRUSTED_ORIGINS: https://auth.${ROOT_DOMAIN}
    volumes:
      - api-socket:/run/api
    # Only on migrate: it already waits for a healthy postgres, and Compose
    # resolves the chain, so naming postgres here as well would be noise.
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: personal_ops
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # Carries the API's unix socket between the api and auth-web containers. No
  # durable state — safe to delete, it is recreated on the next boot.
  api-socket:
