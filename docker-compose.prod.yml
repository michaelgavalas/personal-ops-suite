# Production stack. Standalone, not an override of docker-compose.yml — that one
# publishes 5432 for local dev, which must not carry into production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only caddy publishes ports. web, api and postgres are reachable exclusively on
# the compose network, so the API has no route in from the internet.

name: personal-ops

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      JOB_FINDER_DOMAIN: ${JOB_FINDER_DOMAIN:?set JOB_FINDER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the issued certificates. Losing this volume means re-issuing and
      # burning Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: apps/job-finder-web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:5000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/personal_ops
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: personal_ops
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
