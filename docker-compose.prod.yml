# Production stack. Standalone, not an override of docker-compose.yml — that one
# publishes 5432 for local dev, which must not carry into production.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only caddy publishes ports. web and postgres are reachable exclusively on the
# compose network, and the API not even that — it listens on a unix socket in a
# volume shared with web, so it has no network presence at all.

name: personal-ops

# The api image is used by two services — the server and the one-shot migration
# that runs ahead of it. Sharing the build here names the image once, so the
# second service is a cache hit rather than a second build.
x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: personal-ops-api

x-database-url: &database-url
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/personal_ops

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      JOB_FINDER_DOMAIN: ${JOB_FINDER_DOMAIN:?set JOB_FINDER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the issued certificates. Losing this volume means re-issuing and
      # burning Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: apps/job-finder-web/Dockerfile
    restart: unless-stopped
    environment:
      API_SOCKET_PATH: /run/api/api.sock
    volumes:
      - api-socket:/run/api
    depends_on:
      - api

  # Applies pending migrations, then exits. Runs as its own service rather than
  # from the API's entrypoint so that the schema is never touched by more than
  # one process, however many API containers there turn out to be.
  migrate:
    <<: *api-image
    restart: "no"
    command: node packages/db/dist/migrate.js
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *database-url
      API_SOCKET_PATH: /run/api/api.sock
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # The public origin, path-free — a path here stops Better Auth matching
      # any route. Cookie attributes and OAuth callbacks are built from this,
      # never from the socket address the API answers on.
      BETTER_AUTH_URL: https://${JOB_FINDER_DOMAIN:?set JOB_FINDER_DOMAIN in .env}
    volumes:
      - api-socket:/run/api
    # Only on migrate: it already waits for a healthy postgres, and Compose
    # resolves the chain, so naming postgres here as well would be noise.
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: personal_ops
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # Carries the API's unix socket between the api and web containers. Holds no
  # durable state — safe to delete, it is recreated on the next boot.
  api-socket:
